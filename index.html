<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- ================== SEO ================== -->

      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dvtbbuxon/image/upload/f_auto,q_auto,w_1200/v1767533105/39f80663-2183-43e8-9b0d-a8a8df717517_bfnmjt.jpg"
      fetchpriority="high"
      imagesizes="100vw"
    />

    -->
